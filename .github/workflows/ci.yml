name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy .
      - run: python -m pytest --cov=. --cov-report=term-missing
      - name: Enforce AI release gate
        run: >-
          python -m evaluation.ci_gate
          --suite evaluation/ci_suite.json
          --report artifacts/ci-evaluation-report.json
      - name: Upload evaluation report
        if: ${{ always() && hashFiles('backend/artifacts/ci-evaluation-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontierops-evaluation-report
          path: backend/artifacts/ci-evaluation-report.json
          if-no-files-found: error

  container-build:
    needs: [frontend-quality, backend-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: frontierops-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: frontierops-dashboard:${{ github.sha }}
